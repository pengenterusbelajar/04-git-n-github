<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table kompleks dengan header</title>
  </head>
  <body>
    <h2>bejalar bikin table kompleks dengan header</h2>
    <p>target nya akan membikin 4 kolom tabel dengan header</p>
    <p>HEADER HANYA AKAN BERADA DI ATAS SAJA</p>

    <table>
      <thead>
        <!-- tabel header dianggap sebagai row 1 dari data yang kita miliki -->
        <!-- baris 1 -->
        <tr>
          <th>NOMOR</th>
          <!--kolom 1-->
          <th>NAMA</th>
          <!--kolom 2-->
          <th>NRP</th>
          <!--kolom 3-->
          <th>STATUS</th>
          <!--kolom 4-->
        </tr>
      </thead>
      <tbody>
        <!-- baris 1 -->
        <tr>
          <td>1</td>
          <!--kolom 1-->
          <td>badrul</td>
          <!--kolom 2-->
          <td>759375</td>
          <!--kolom 3-->
          <td>masuk</td>
          <!--kolom 4-->
        </tr>
        <!-- baris 2 -->
        <tr>
          <td>2</td>
          <!--kolom 1-->
          <td>candra</td>
          <!--kolom 2-->
          <td>759435</td>
          <!--kolom 3-->
          <td>masuk</td>
          <!--kolom 4-->
        </tr>
        <!-- baris 3 -->
        <tr>
          <td>3</td>
          <!--kolom 1-->
          <td>diki</td>
          <!--kolom 2-->
          <td>599435</td>
          <!--kolom 3-->
          <td>masuk</td>
          <!--kolom 4-->
        </tr>
        <!-- baris 4 -->
        <tr>
          <td>4</td>
          <!--kolom 1-->
          <td>fahrul</td>
          <!--kolom 2-->
          <td>569435</td>
          <!--kolom 3-->
          <td>ijin</td>
          <!--kolom 4-->
        </tr>
      </tbody>
    </table>
  </body>
</html>
