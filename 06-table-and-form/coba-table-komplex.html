<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coba table komplex</title>
  </head>
  <body>
    <h1>coba membuat table komplex dengan header di atas dan samping kiri</h1>
    <p>
      disini target bisa membuat tabel dengan header di sisi atas dan kiri tabel
      nya
    </p>
    <table>
      <thead>
        <tr>
          <!-- col1 -->
          <th></th>
          <!-- col2 -->
          <th>panjang</th>
          <!-- col3 -->
          <th>lebar</th>
        </tr>
      </thead>
      <!-- tbody menandakan semantik pada halaman tabel. tabel akan tetap tampil sesuai perhitungan row dan kolom seperti biasa, namun dengan pemberian thead dan tbody memberikan makna pada tabel kita -->
      <tbody>
        <tr>
          <!-- th akan membuat font menjadi bold, karena bold menandakan header. -->
          <th>rumah 1</th>
          <td>45</td>
          <td>10</td>
        </tr>
        <tr>
          <th>rumah 2</th>
          <td>15</td>
          <td>10</td>
        </tr>
        <tr>
          <th>rumah 3</th>
          <td>20</td>
          <td>16</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
